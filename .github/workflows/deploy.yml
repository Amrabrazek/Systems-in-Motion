# Publishes main to GitHub Pages via the gh-pages branch (ADR 0008).
# One-time repo setting: Settings → Pages → Source "Deploy from a branch", branch gh-pages, / (root).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Shared with PR previews: both write to gh-pages, so they must take turns.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          # Keep the PR previews that live next to the main site.
          clean-exclude: pr-preview/
          force: false
