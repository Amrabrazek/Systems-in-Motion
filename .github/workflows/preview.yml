# Each PR gets a preview at /<repo>/pr-preview/pr-<N>/, removed when the PR closes (ADR 0008).
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    # Forks can't push to gh-pages, so only previews for branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        if: github.event.action != 'closed'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: github.event.action != 'closed'
      - run: npm run build
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
